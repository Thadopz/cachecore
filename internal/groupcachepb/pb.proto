syntax = "proto3";

package groupCachepb; 
option go_package = "github.com/Thadopz/cachecore/internal/groupcachepb";

message Request {
  string group = 1;
  string key = 2;
  int64 delta = 3;
}

message Response {
  bytes value = 1;
  int32 code = 2;
  string errMsg = 3;
  bool notFound = 4;
}

service GroupCache {
  rpc Get(Request) returns (Response);
}
